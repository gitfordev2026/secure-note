# Cloudflare Pages + D1 configuration for NoteApp
# Uses @opennextjs/cloudflare adapter for Next.js 16 support
name = "noteapp"
compatibility_date = "2026-11-13"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "noteapp-db"

[dev]
port = 3080

[vars]
NEXT_PUBLIC_APP_URL = "https://noteapp.pages.dev"
NEXT_PUBLIC_SITE_NAME = "NoteApp"

[observability]
enabled = true

[build]
command = "pnpm build"
# OpenNext will handle the build output for Cloudflare Pages
