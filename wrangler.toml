# Cloudflare Pages + D1 configuration for NoteApp
name = "noteapp"
compatibility_date = "2026-11-10"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "noteapp-db"

[build]
command = "pnpm build"
command = "pnpm build"
# Cloudflare Pages will detect this is a Next.js project
# Output directory for Next.js on Pages
publish_directory = ".next"

[dev]
port = 3080

[vars]
NEXT_PUBLIC_APP_URL = "https://noteapp.pages.dev"
NEXT_PUBLIC_SITE_NAME = "NoteApp"

[observability]
enabled = true
